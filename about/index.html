        <p style="color: #5f6368; margin-top: 0;">
          The alumni network for Jawahar Navodaya Vidyalaya students, ex-students and staff.
        </p>
        <p>
          Navodaya Alumni App is a free, privacy-focused platform that helps Navodayans find each other
          again. Create a profile, search the alumni directory, reconnect with your batchmates, discover
          businesses run by fellow alumni, and register for alumni events — all in one place.
        </p>
        <ul>
          <li>Find alumni by name, school, batch or location.</li>
          <li>See everyone from your JNV and entry year in one place.</li>
          <li>Browse and list businesses run by Navodayans.</li>
          <li>Find alumni events, register and check in at the venue.</li>
          <li>Carry a verifiable digital alumni identity.</li>
          <li>Control what other members can see about you.</li>
        </ul>
        <p>
          Signing in needs no password: use a one-time code sent to your email, an authenticator app, or
          Sign in with Google. Google sign-in is used only to confirm that the email address belongs to
          you — we request nothing beyond your name, email address and profile picture.
