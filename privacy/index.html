         below overwrites them from site.config.js when the site is rebranded. -->
    <div id="splash">
      <img id="splash-logo" alt="Logo" />
      <div class="splash-name" id="splash-name">Navodaya Alumni App</div>
      <div class="splash-tagline" id="splash-tagline">Connecting Navodayans!</div>
    </div>
    <script>
      // Populate splash from runtime config (already loaded above)
      var c = window.SITE_CONFIG || {};
      document.getElementById('splash-logo').src = c.siteLogo || '';
      if (c.siteName) document.getElementById('splash-name').textContent = c.siteName;
      if (c.siteTagline) document.getElementById('splash-tagline').textContent = c.siteTagline;
    </script>
